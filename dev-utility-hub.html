<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Utility Hub</title>
<meta name="description" content="폐쇄망용 오프라인 개발자 올인원 유틸리티 (단일 HTML)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fde'/%3E%3Ctext x='16' y='21.5' font-family='Consolas,monospace' font-size='15' font-weight='700' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   Dev Utility Hub — 오프라인 단일 HTML 개발 도구 모음
   외부 CDN / 웹폰트 / 원격 요청 없음 (HTTP 테스터에서 사용자가 보내는 요청 제외)
   ============================================================ */
:root {
  --bg: #f5f6f8; --bg-elev: #ffffff; --bg-sunk: #f0f2f5; --bg-hover: #e9ecf1;
  --border: #dde1e7; --border-strong: #c5cbd4;
  --text: #1c2230; --text-dim: #5a6474; --text-faint: #8b94a3;
  --accent: #2f6fde; --accent-hover: #255fc4; --accent-weak: #e7eefc; --accent-text: #ffffff;
  --ok: #1d8a4c; --ok-weak: #e2f3e9; --warn: #a96500; --warn-weak: #fcf0da; --err: #c73636; --err-weak: #fbe6e6; --info: #2f6fde; --info-weak: #e7eefc;
  --add-bg: #e3f5e8; --add-hl: #a9e0b9; --del-bg: #fde9e9; --del-hl: #f3b4b4; --mod-bg: #fff6dc;
  --syn-key: #8a35b8; --syn-str: #17803d; --syn-num: #b05300; --syn-bool: #0a5fc2; --syn-null: #8b94a3; --syn-punct: #6b7383;
  --syn-kw: #0a5fc2; --syn-tag: #b3261e; --syn-attr: #8a35b8; --syn-comment: #8b94a3; --syn-fn: #8a5a00;
  --mark: #ffe58a; --mark2: #c9e4ff; --mark-cur: #ffb347;
  --sel: rgba(47, 111, 222, .25); --focus: rgba(47, 111, 222, .45);
  --info-line: #bcd0f5; --warn-line: #ecc98a; --err-line: #efb3b3; --ok-line: #a9dbbd;
  --shadow: 0 6px 24px rgba(16, 24, 40, .14);
  --radius: 8px;
  --font: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  --mono: "D2Coding", "D2 Coding", Consolas, "JetBrains Mono", "Cascadia Mono", Menlo, "Malgun Gothic", monospace;
  --code-size: 13px; --code-lh: 20px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #121519; --bg-elev: #1a1e24; --bg-sunk: #15181d; --bg-hover: #242a32;
  --border: #2a3039; --border-strong: #3a424e;
  --text: #e3e7ed; --text-dim: #a2abb8; --text-faint: #6f7987;
  --accent: #5b93f0; --accent-hover: #74a5f4; --accent-weak: #1f2c44; --accent-text: #0b1220;
  --ok: #4cc27f; --ok-weak: #15301f; --warn: #e3a33b; --warn-weak: #33270f; --err: #f06a6a; --err-weak: #3a1a1a; --info: #5b93f0; --info-weak: #1f2c44;
  --add-bg: #15301f; --add-hl: #22603a; --del-bg: #3a1a1c; --del-hl: #7a2c30; --mod-bg: #332b12;
  --syn-key: #d29cf5; --syn-str: #8fd18f; --syn-num: #f0a35e; --syn-bool: #74a9f7; --syn-null: #7f8a99; --syn-punct: #8f99a8;
  --syn-kw: #74a9f7; --syn-tag: #f28b82; --syn-attr: #d29cf5; --syn-comment: #6f7987; --syn-fn: #e5c07b;
  --mark: #6b5a12; --mark2: #1f4a73; --mark-cur: #a8620f;
  --sel: rgba(91, 147, 240, .35); --focus: rgba(91, 147, 240, .55);
  --info-line: #2e4672; --warn-line: #5e4515; --err-line: #6a2a2a; --ok-line: #24553a;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code, kbd, .mono { font-family: var(--mono); }
kbd { font-size: 11px; padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--bg-elev); color: var(--text-dim); }
::selection { background: var(--sel); }
.hidden, [hidden] { display: none !important; }
.sp { flex: 1; }
.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.nowrap { white-space: nowrap; }

/* ---------- App layout ---------- */
#app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100vh; }
#sidebar { display: flex; flex-direction: column; background: var(--bg-elev); border-right: 1px solid var(--border); min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; cursor: pointer; user-select: none; }
.brand-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 14px var(--mono); flex: none; }
.brand-name { font-weight: 700; font-size: 14px; line-height: 1.2; }
.brand-sub { font-size: 11px; color: var(--text-faint); display: flex; align-items: center; gap: 5px; }
.brand-sub .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.search-btn { margin: 4px 12px 8px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); background: var(--bg-sunk); border-radius: 7px; color: var(--text-faint); cursor: pointer; text-align: left; }
.search-btn:hover { border-color: var(--border-strong); }
.search-btn .sp { flex: 1; }
#nav { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.nav-group { margin-top: 10px; }
.nav-group-title { font-size: 11px; font-weight: 700; color: var(--text-faint); letter-spacing: .02em; padding: 4px 8px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 8px; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left; color: var(--text); }
.nav-item:hover { background: var(--bg-hover); }
.nav-item.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.abbr { flex: none; width: 30px; height: 20px; border-radius: 5px; display: grid; place-items: center; font: 700 9.5px/1 var(--mono); background: var(--bg-sunk); border: 1px solid var(--border); color: var(--text-dim); letter-spacing: -.02em; }
.nav-item.on .abbr { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.side-foot { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; gap: 6px; align-items: center; }

#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--bg-elev); min-height: 54px; }
#menuBtn { display: none; }
#toolTitle { font-size: 16px; font-weight: 700; margin: 0; white-space: nowrap; }
#toolDesc { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#view { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 18px; }
.tool { display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.tool.fill { height: 100%; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 30px; padding: 0 11px; border: 1px solid var(--border-strong); background: var(--bg-elev); border-radius: 6px; cursor: pointer; white-space: nowrap; color: var(--text); }
.btn:hover { background: var(--bg-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--err); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 5px; }
.btn.xs { height: 22px; padding: 0 6px; font-size: 11.5px; border-radius: 5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-dim); }
.btn.ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn.icon { width: 30px; padding: 0; }
.inp, select.inp { height: 30px; padding: 0 9px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--bg-elev); min-width: 0; }
.inp:focus, textarea:focus, select:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.inp.sm { height: 24px; font-size: 12px; padding: 0 7px; }
.inp.mono { font-family: var(--mono); }
textarea.inp { height: auto; padding: 7px 9px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
label.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; user-select: none; color: var(--text-dim); }
label.chk:hover { color: var(--text); }
label.chk input { margin: 0; accent-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
.toolbar .lbl { color: var(--text-dim); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--text-dim); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; background: var(--bg-elev); }
.seg button { border: 0; background: none; height: 28px; padding: 0 10px; cursor: pointer; color: var(--text-dim); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--bg-hover); color: var(--text); }
.seg button.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .cnt { font-size: 11px; color: var(--text-faint); margin-left: 3px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; font-size: 11.5px; font-weight: 600; background: var(--bg-sunk); color: var(--text-dim); border: 1px solid var(--border); white-space: nowrap; }
.badge.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-weak); color: var(--warn); border-color: transparent; }
.badge.err { background: var(--err-weak); color: var(--err); border-color: transparent; }
.badge.info { background: var(--info-weak); color: var(--info); border-color: transparent; }
.card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); }
.card-pad { padding: 12px 14px; }
.card h3 { margin: 0 0 8px; font-size: 13px; }
.note { padding: 8px 12px; border-radius: 7px; background: var(--info-weak); color: var(--text); font-size: 12px; border: 1px solid var(--info-line); }
.note.warn { background: var(--warn-weak); border-color: var(--warn-line); }
.note.err { background: var(--err-weak); border-color: var(--err-line); }
.note.ok { background: var(--ok-weak); border-color: var(--ok-line); }
.note b { font-weight: 700; }
.msg-ok { color: var(--ok); } .msg-err { color: var(--err); } .msg-warn { color: var(--warn); } .msg-info { color: var(--text-dim); }

/* ---------- Pane (editor) ---------- */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; flex: 1; min-height: 340px; }
.split.v { grid-template-columns: minmax(0, 1fr); }
.split.s3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }
.pane.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.pane-head { display: flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; min-height: 32px; border-bottom: 1px solid var(--border); background: var(--bg-sunk); }
.pane-title { font-weight: 600; font-size: 12px; white-space: nowrap; }
.pane-extra { display: flex; align-items: center; gap: 4px; min-width: 0; }
.pane-acts { display: flex; align-items: center; gap: 1px; }
.pane-body { flex: 1; display: flex; min-height: 0; position: relative; }
.pane-foot { display: flex; gap: 8px; align-items: center; padding: 2px 10px; min-height: 24px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-faint); background: var(--bg-sunk); }
.pane-foot .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-foot .msg a { cursor: pointer; text-decoration: underline; }
.gutter { flex: none; overflow: hidden; position: relative; background: var(--bg-sunk); border-right: 1px solid var(--border); color: var(--text-faint); font: var(--code-size)/var(--code-lh) var(--mono); text-align: right; user-select: none; min-width: 38px; }
.gutter-inner { padding: 8px 8px 40px 6px; white-space: pre; will-change: transform; }
.gutter-mark { position: absolute; left: 0; right: 0; height: var(--code-lh); background: var(--err-weak); border-left: 3px solid var(--err); pointer-events: none; }
textarea.code { flex: 1; min-width: 0; border: 0; resize: none; outline: none; background: transparent; color: var(--text); padding: 8px 10px 40px; font: var(--code-size)/var(--code-lh) var(--mono); white-space: pre; overflow: auto; tab-size: 4; }
textarea.code.wrap { white-space: pre-wrap; word-break: break-all; }
textarea.code::placeholder { color: var(--text-faint); white-space: pre-wrap; }
.code-scroll { flex: 1; overflow: auto; display: flex; align-items: flex-start; min-width: 0; }
.code-scroll .gutter { position: sticky; left: 0; z-index: 1; min-height: 100%; overflow: visible; }
.code-scroll .gutter-inner { will-change: auto; }
pre.code { margin: 0; flex: 1; padding: 8px 10px 40px; font: var(--code-size)/var(--code-lh) var(--mono); white-space: pre; tab-size: 4; color: var(--text); min-width: 0; }
pre.code.wrap { white-space: pre-wrap; word-break: break-all; }
.pane-empty { color: var(--text-faint); padding: 14px; font-size: 12.5px; white-space: pre-wrap; }
.pane-view { flex: 1; overflow: auto; min-width: 0; }

/* syntax */
.t-key { color: var(--syn-key); } .t-str { color: var(--syn-str); } .t-num { color: var(--syn-num); } .t-bool { color: var(--syn-bool); }
.t-null { color: var(--syn-null); font-style: italic; } .t-p { color: var(--syn-punct); } .t-kw { color: var(--syn-kw); font-weight: 600; }
.t-tag { color: var(--syn-tag); } .t-attr { color: var(--syn-attr); } .t-com { color: var(--syn-comment); font-style: italic; } .t-fn { color: var(--syn-fn); }
.t-var { color: var(--syn-num); font-weight: 600; } .t-err { color: var(--err); font-weight: 600; } .t-warn { color: var(--warn); font-weight: 600; }
.t-ok { color: var(--ok); } .t-dim { color: var(--text-faint); }
mark, .mk { background: var(--mark); color: inherit; border-radius: 2px; }
.mk.cur { background: var(--mark-cur); }

/* ---------- Tables ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th, .tbl td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { font-weight: 600; color: var(--text-dim); background: var(--bg-sunk); position: sticky; top: 0; z-index: 1; font-size: 12px; }
.tbl td.mono, .tbl .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.tbl tr:hover td { background: var(--bg-hover); }
.tbl td.k { color: var(--text-dim); white-space: nowrap; width: 1%; }
.tbl-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); }
.tbl-wrap .tbl tr:last-child td { border-bottom: 0; }
.copy-cell { cursor: pointer; }
.copy-cell:hover { text-decoration: underline dotted; }

/* key-value editor */
.kv { width: 100%; border-collapse: collapse; }
.kv td { padding: 2px 3px; border-bottom: 1px solid var(--border); }
.kv td:first-child { width: 26px; text-align: center; }
.kv td:last-child { width: 30px; }
.kv input[type=text] { width: 100%; height: 27px; border: 1px solid transparent; background: transparent; padding: 0 6px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }
.kv input[type=text]:hover { border-color: var(--border); }
.kv input[type=text]:focus { border-color: var(--accent); background: var(--bg-elev); outline: none; }
.kv tr.off input[type=text] { color: var(--text-faint); text-decoration: line-through; }
.kv th { font-size: 11.5px; color: var(--text-faint); text-align: left; padding: 3px 9px; font-weight: 600; }

/* ---------- Popups ---------- */
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 1000; pointer-events: none; align-items: center; }
.toast { background: #1f2430; color: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 12.5px; animation: toastIn .18s ease-out; max-width: 80vw; }
.toast.err { background: #b32d2d; } .toast.ok { background: #1b7a44; } .toast.warn { background: #9a5c00; }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }
.menu { position: fixed; z-index: 900; min-width: 180px; max-width: min(460px, 92vw); max-height: 60vh; overflow: auto; background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; }
.menu-item { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 5px; cursor: pointer; color: var(--text); white-space: nowrap; }
.menu-item:hover, .menu-item.on { background: var(--bg-hover); }
.menu-item .abbr { width: 28px; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }
.menu-label { font-size: 11px; color: var(--text-faint); padding: 4px 10px 2px; font-weight: 600; }
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 800; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow); width: min(720px, 100%); max-height: 84vh; display: flex; flex-direction: column; overflow: hidden; }
.modal.wide { width: min(1000px, 100%); }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 15px; }
.modal-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.palette { width: min(620px, 100%); }
.palette input { border: 0; border-bottom: 1px solid var(--border); padding: 14px 16px; font-size: 15px; outline: none; background: transparent; width: 100%; }
.palette-list { overflow: auto; max-height: 56vh; padding: 6px; }
.palette-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.palette-item.on { background: var(--accent-weak); }
.palette-item .pd { color: var(--text-faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item .pg { margin-left: auto; font-size: 11px; color: var(--text-faint); white-space: nowrap; }

/* ---------- Home ---------- */
.home { max-width: 1180px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.hero h1 { margin: 0; font-size: 22px; }
.hero p { margin: 4px 0 0; color: var(--text-dim); }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.gcard { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.gcard h3 { margin: 0 0 8px; font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.gtool { display: flex; align-items: flex-start; gap: 10px; width: 100%; border: 0; background: none; padding: 6px; border-radius: 7px; cursor: pointer; text-align: left; color: var(--text); }
.gtool:hover { background: var(--bg-hover); }
.gtool b { display: block; font-weight: 600; font-size: 13px; }
.gtool small { display: block; color: var(--text-faint); font-size: 11.5px; line-height: 1.4; }
.gtool .abbr { margin-top: 1px; }
.env-list { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- JSON tree ---------- */
.jt { font: var(--code-size)/var(--code-lh) var(--mono); padding: 6px 4px 30px; }
.jt-row { display: flex; align-items: baseline; gap: 4px; padding: 0 6px 0 0; border-radius: 4px; cursor: default; white-space: nowrap; }
.jt-row:hover { background: var(--bg-hover); }
.jt-row.sel { background: var(--accent-weak); }
.jt-row.hit { background: var(--mark); }
.jt-tog { width: 14px; flex: none; text-align: center; color: var(--text-faint); cursor: pointer; font-size: 10px; }
.jt-key { color: var(--syn-key); }
.jt-idx { color: var(--text-faint); }
.jt-meta { color: var(--text-faint); font-size: 11.5px; }
.jt-val { overflow: hidden; text-overflow: ellipsis; }
.jt-kids { padding-left: 16px; border-left: 1px dotted var(--border-strong); margin-left: 6px; }
.jt-path { display: flex; gap: 6px; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--border); background: var(--bg-sunk); font-family: var(--mono); font-size: 12px; min-height: 32px; flex-wrap: wrap; }
.jt-path code { color: var(--accent); word-break: break-all; }

/* ---------- Diff ---------- */
.diff { font: var(--code-size)/var(--code-lh) var(--mono); }
.diff table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.diff td { padding: 0 8px; white-space: pre-wrap; word-break: break-all; vertical-align: top; }
.diff td.ln { width: 46px; text-align: right; color: var(--text-faint); user-select: none; background: var(--bg-sunk); padding: 0 6px; font-size: 12px; }
.diff td.sg { width: 18px; text-align: center; user-select: none; color: var(--text-faint); padding: 0; }
.diff tr.add td.c, .diff td.c.add { background: var(--add-bg); }
.diff tr.del td.c, .diff td.c.del { background: var(--del-bg); }
.diff td.c.empty { background: repeating-linear-gradient(-45deg, transparent 0 5px, var(--bg-sunk) 5px 10px); }
.diff ins { background: var(--add-hl); text-decoration: none; border-radius: 2px; }
.diff del { background: var(--del-hl); text-decoration: none; border-radius: 2px; }
.diff tr.fold td { background: var(--bg-sunk); color: var(--text-faint); text-align: center; cursor: pointer; font-family: var(--font); font-size: 12px; padding: 3px; }
.diff tr.fold:hover td { color: var(--accent); }
.diff tr.cur td.c { outline: 1px solid var(--accent); outline-offset: -1px; }

/* ---------- Log ---------- */
.log-list { font: 12.5px/19px var(--mono); }
.log-e { border-bottom: 1px solid var(--border); padding: 3px 8px 3px 6px; display: grid; grid-template-columns: 18px auto 58px minmax(0, 1fr); gap: 0 8px; align-items: baseline; }
.log-e:hover { background: var(--bg-hover); }
.log-e .tg { cursor: pointer; color: var(--text-faint); text-align: center; user-select: none; }
.log-e .ts { color: var(--text-faint); white-space: nowrap; font-size: 12px; }
.log-e .lv { font-size: 10.5px; font-weight: 700; text-align: center; border-radius: 4px; padding: 0 3px; }
.log-e .m { white-space: pre-wrap; word-break: break-all; min-width: 0; }
.log-e .more { grid-column: 4; white-space: pre; overflow-x: auto; color: var(--text-dim); font-size: 12px; margin-top: 2px; padding: 4px 6px; background: var(--bg-sunk); border-radius: 4px; }
.lv-ERROR, .lv-FATAL, .lv-SEVERE { background: var(--err-weak); color: var(--err); }
.lv-WARN, .lv-WARNING { background: var(--warn-weak); color: var(--warn); }
.lv-INFO { background: var(--info-weak); color: var(--info); }
.lv-DEBUG, .lv-TRACE, .lv-FINE, .lv-FINER, .lv-FINEST, .lv-CONFIG, .lv-NONE { background: var(--bg-sunk); color: var(--text-faint); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid var(--border-strong); background: var(--bg-elev); cursor: pointer; font-size: 12px; user-select: none; }
.chip.off { opacity: .45; text-decoration: line-through; }
.chip b { font-weight: 700; }

/* ---------- Stack trace ---------- */
.st { font: 12.5px/20px var(--mono); padding: 8px 12px 30px; }
.st-ex { margin: 6px 0 2px; }
.st-ex .ty { color: var(--err); font-weight: 700; }
.st-ex.caused .lbl { color: var(--warn); font-weight: 700; }
.st-fr { padding-left: 24px; white-space: pre; }
.st-fr.app { color: var(--text); font-weight: 600; background: var(--accent-weak); border-radius: 3px; }
.st-fr.fw { color: var(--text-faint); }
.st-fold { padding-left: 24px; color: var(--text-faint); cursor: pointer; font-style: italic; }
.st-fold:hover { color: var(--accent); }
.st-root { border: 1px solid var(--err-line); background: var(--err-weak); border-radius: 8px; padding: 10px 12px; margin: 4px 12px 0; font-size: 12.5px; }
.st-root .mono { word-break: break-all; }

/* ---------- HTTP ---------- */
.http-line { display: flex; gap: 6px; align-items: center; }
.http-line .method { width: 104px; font-weight: 700; font-family: var(--mono); }
.http-line .url { flex: 1; font-family: var(--mono); height: 34px; }
.http-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; flex: 1; min-height: 420px; }
.http-cols > .card { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tab-body { flex: 1; min-height: 0; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.tab-body .pane { flex: 1; min-height: 200px; }
.status-pill { font: 700 12px var(--mono); padding: 2px 8px; border-radius: 5px; }
.m-GET { color: #1d8a4c; } .m-POST { color: #a96500; } .m-PUT { color: #2f6fde; } .m-PATCH { color: #8a35b8; } .m-DELETE { color: #c73636; } .m-HEAD, .m-OPTIONS { color: var(--text-dim); }
.hist-item { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12px; }
.hist-item:hover { background: var(--bg-hover); }
.hist-item .u { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.hist-item .mth { font: 700 11px var(--mono); width: 54px; flex: none; }
.side-panel { width: 300px; flex: none; display: flex; flex-direction: column; min-height: 0; }

/* ---------- OpenAPI ---------- */
.op { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: var(--bg-elev); overflow: hidden; }
.op-head { display: flex; gap: 10px; align-items: center; padding: 7px 10px; cursor: pointer; }
.op-head:hover { background: var(--bg-hover); }
.op-m { font: 700 11.5px var(--mono); width: 62px; text-align: center; padding: 2px 0; border-radius: 4px; color: #fff; flex: none; }
.op-m.get { background: #1d8a4c; } .op-m.post { background: #c98200; } .op-m.put { background: #2f6fde; } .op-m.patch { background: #8a35b8; } .op-m.delete { background: #c73636; } .op-m.other { background: #6b7383; }
.op-path { font-family: var(--mono); font-weight: 600; word-break: break-all; }
.op-sum { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op-body { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.op-dep .op-path { text-decoration: line-through; }

/* ---------- Misc ---------- */
.kvlist { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-elev); }
.kvlist > div { padding: 6px 10px; border-bottom: 1px solid var(--border); min-width: 0; }
.kvlist > div:nth-last-child(-n+3) { border-bottom: 0; }
.kvlist .k { color: var(--text-dim); font-size: 12px; background: var(--bg-sunk); white-space: nowrap; }
.kvlist .v { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.kvlist .a { display: flex; align-items: center; padding: 3px 6px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-dim); }
.stat-row b { color: var(--text); font-family: var(--mono); font-weight: 600; }
.section-title { font-size: 12px; font-weight: 700; color: var(--text-dim); margin: 2px 0 0; }
.regex-view { font: var(--code-size)/var(--code-lh) var(--mono); white-space: pre-wrap; word-break: break-all; padding: 8px 10px 30px; }
.regex-view .mk.alt { background: var(--mark2); }
.preview-frame { border: 0; width: 100%; flex: 1; background: #fff; min-height: 300px; }
.img-preview { max-width: 100%; max-height: 360px; border: 1px solid var(--border); border-radius: 6px; background: repeating-conic-gradient(var(--bg-sunk) 0 25%, transparent 0 50%) 50% / 16px 16px; }
.empty-state { padding: 30px; text-align: center; color: var(--text-faint); }
.findings .f { display: flex; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); align-items: baseline; font-size: 12.5px; }
.findings .f:last-child { border-bottom: 0; }

/* ---------- 작업 탭 ---------- */
#tabbar { display: flex; gap: 2px; padding: 5px 10px 0; border-bottom: 1px solid var(--border); background: var(--bg-sunk); overflow-x: auto; overflow-y: hidden; min-height: 36px; align-items: flex-end; scrollbar-width: thin; flex: none; }
.wtab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 10px; border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; background: transparent; cursor: pointer; white-space: nowrap; color: var(--text-dim); font-size: 12.5px; max-width: 210px; flex: none; user-select: none; }
.wtab:hover { background: var(--bg-hover); }
.wtab.on { background: var(--bg-elev); border-color: var(--border); color: var(--text); font-weight: 600; position: relative; top: 1px; }
.wtab .abbr { width: 26px; height: 18px; font-size: 9px; }
.wt-name { overflow: hidden; text-overflow: ellipsis; }
.wt-x { border: 0; background: none; color: var(--text-faint); cursor: pointer; border-radius: 4px; width: 18px; height: 18px; font-size: 10px; padding: 0; flex: none; }
.wt-x:hover { background: var(--bg-hover); color: var(--err); }
.wt-plus { padding: 0 10px; font-size: 12px; }
.smart-btn { margin-top: -2px; color: var(--accent); }
.menu-item > span:last-child { overflow: hidden; text-overflow: ellipsis; }
/* ---------- Smart Paste / 레시피 ---------- */
.sp-res { display: flex; flex-direction: column; gap: 8px; }
.sp-item { border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; background: var(--bg-elev); display: flex; flex-direction: column; gap: 6px; }
.sp-item.top { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.sp-item .sp-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp-item .sp-d { color: var(--text-dim); font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 4.6em; overflow: hidden; font-family: var(--mono); }
.sp-score { font: 600 11px var(--mono); color: var(--text-faint); }
.rc-wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1.25fr); gap: 10px; flex: 1; min-height: 420px; }
.rc-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 8px; }
.rc-ops { flex: 1; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); padding: 4px; }
.rc-op { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; color: var(--text); font-size: 12.5px; }
.rc-op:hover { background: var(--accent-weak); color: var(--accent); }
.rc-steps { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.rc-step { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elev); }
.rc-step.sel { border-color: var(--accent); }
.rc-step.err { border-color: var(--err); }
.rc-step.off { opacity: .55; }
.rc-step .rc-h { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-bottom: 1px solid var(--border); background: var(--bg-sunk); border-radius: 8px 8px 0 0; cursor: pointer; }
.rc-step .rc-b { padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; }
.rc-step .rc-s { font-size: 11px; color: var(--text-faint); padding: 0 10px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-step .rc-s.err { color: var(--err); white-space: normal; }
@media (max-width: 1100px) { .rc-wrap { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .rc-wrap > .rc-col:first-child { grid-column: 1 / -1; max-height: 220px; } }
@media (max-width: 960px) {
  .split, .http-cols, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .split > .pane { min-height: 260px; }
  .side-panel { width: 100%; }
}
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #sidebar { position: fixed; z-index: 700; inset: 0 auto 0 0; width: 260px; transform: translateX(-102%); transition: transform .18s; box-shadow: var(--shadow); }
  body.nav-open #sidebar { transform: none; }
  #menuBtn { display: inline-flex; }
  #view { padding: 10px 12px 16px; }
  #topbar { padding: 8px 12px; }
  #toolDesc { display: none; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media print { #sidebar, #topbar { display: none; } #app { display: block; } }
/* =====================================================================
   디자인 스킨 (설정 → 디자인). html[data-design] 으로 전환, 라이트/다크 모두 지원
   ===================================================================== */

/* ---------- D. 미드나잇 (네이비 · 그라데이션) ---------- */
:root[data-design="midnight"] {
  --bg: #f3f5fb; --bg-elev: #ffffff; --bg-sunk: #eef1f8; --bg-hover: #e8ecf6;
  --border: #e1e6f0; --border-strong: #c9d1e1;
  --text: #0f172a; --text-dim: #4b5568; --text-faint: #8a94a8;
  --accent: #6d5dfc; --accent-hover: #5a49f0; --accent-weak: #eceaff; --accent-text: #ffffff;
  --ok: #059669; --ok-weak: #dcf5ec; --warn: #ea580c; --warn-weak: #ffeadb; --err: #e11d48; --err-weak: #fde4ea; --info: #3b82f6; --info-weak: #e3edff;
  --info-line: #bfd3fb; --warn-line: #fbc9a8; --err-line: #f7b4c3; --ok-line: #a7e3cc;
  --syn-key: #5b4bd6; --syn-str: #0f8a6a; --syn-num: #d6336c; --syn-bool: #2563eb; --syn-null: #8a94a8; --syn-punct: #64748b; --syn-kw: #6d5dfc; --syn-tag: #db2777; --syn-attr: #5b4bd6; --syn-fn: #0e7490;
  --mark: #d9dcff; --mark2: #cdeffa; --mark-cur: #b7b3ff; --sel: rgba(109, 93, 252, .2); --focus: rgba(109, 93, 252, .45);
  --grad: linear-gradient(120deg, #6d5dfc 0%, #3b82f6 55%, #06b6d4 100%);
  --glow: 0 6px 18px rgba(109, 93, 252, .28);
  --radius: 12px; --shadow: 0 18px 50px rgba(15, 23, 42, .16);
}
:root[data-design="midnight"][data-theme="dark"] {
  --bg: #070b16; --bg-elev: #0e1426; --bg-sunk: #0a0f1d; --bg-hover: #172038;
  --border: #1d2743; --border-strong: #2d3a60;
  --text: #e6e9f5; --text-dim: #9aa3bd; --text-faint: #5f6984;
  --accent: #8b7dff; --accent-hover: #a397ff; --accent-weak: #1e1b48; --accent-text: #ffffff;
  --ok: #34d399; --ok-weak: #0d2b25; --warn: #fb923c; --warn-weak: #33200f; --err: #fb7185; --err-weak: #3a1520; --info: #60a5fa; --info-weak: #13213f;
  --info-line: #23406e; --warn-line: #5c3417; --err-line: #6a2433; --ok-line: #175443;
  --syn-key: #b4a8ff; --syn-str: #6ee7b7; --syn-num: #f9a8d4; --syn-bool: #7dd3fc; --syn-null: #64708c; --syn-punct: #8792b0; --syn-kw: #c4b5fd; --syn-tag: #f472b6; --syn-attr: #b4a8ff; --syn-fn: #67e8f9;
  --mark: #2e2a7a; --mark2: #134153; --mark-cur: #4338ca; --sel: rgba(139, 125, 255, .3); --focus: rgba(139, 125, 255, .6);
  --grad: linear-gradient(120deg, #8b7dff 0%, #4f8bff 55%, #22d3ee 100%);
  --glow: 0 0 0 1px rgba(139, 125, 255, .35), 0 8px 26px rgba(99, 102, 241, .4);
}
[data-design="midnight"] #view { background: radial-gradient(1100px 480px at 105% -12%, rgba(109, 93, 252, .12), transparent 60%), radial-gradient(900px 460px at -12% 112%, rgba(6, 182, 212, .10), transparent 60%), var(--bg); }
[data-design="midnight"][data-theme="dark"] #view { background: radial-gradient(1100px 480px at 105% -12%, rgba(139, 125, 255, .20), transparent 60%), radial-gradient(900px 460px at -12% 112%, rgba(34, 211, 238, .12), transparent 60%), var(--bg); }
[data-design="midnight"][data-theme="dark"] #sidebar { background: #0a0f1d; }
[data-design="midnight"] .brand-logo { background: var(--grad); box-shadow: var(--glow); border-radius: 10px; }
[data-design="midnight"] .search-btn { border-radius: 10px; }
[data-design="midnight"] .nav-group-title { letter-spacing: .08em; }
[data-design="midnight"] .nav-item { border-radius: 8px; position: relative; }
[data-design="midnight"] .nav-item.on { background: var(--accent-weak); color: var(--text); }
[data-design="midnight"] .nav-item.on::before { content: ''; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; background: var(--grad); }
[data-design="midnight"] .nav-item.on .abbr { background: var(--grad); border-color: transparent; color: #fff; }
[data-design="midnight"] #toolTitle, [data-design="midnight"] .hero h1 { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
[data-design="midnight"] #toolTitle { font-size: 18px; letter-spacing: -.01em; }
[data-design="midnight"] .hero h1 { font-size: 34px; letter-spacing: -.02em; }
[data-design="midnight"] #tabbar { background: var(--bg-sunk); }
[data-design="midnight"] .wtab { border-radius: 9px 9px 0 0; }
[data-design="midnight"] .wtab.on { box-shadow: inset 0 2px 0 var(--accent); }
[data-design="midnight"] .btn { border-radius: 9px; }
[data-design="midnight"] .btn.primary { background: var(--grad); border-color: transparent; box-shadow: var(--glow); color: #fff; }
[data-design="midnight"] .btn.primary:hover { filter: brightness(1.08); }
[data-design="midnight"] .inp, [data-design="midnight"] .seg { border-radius: 9px; }
[data-design="midnight"] .seg button.on { background: var(--accent); color: #fff; }
[data-design="midnight"] .pane, [data-design="midnight"] .card, [data-design="midnight"] .gcard, [data-design="midnight"] .tbl-wrap, [data-design="midnight"] .kvlist, [data-design="midnight"] .sp-item, [data-design="midnight"] .rc-step, [data-design="midnight"] .op, [data-design="midnight"] .rc-ops { border-radius: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px rgba(15, 23, 42, .05); }
[data-design="midnight"][data-theme="dark"] .pane, [data-design="midnight"][data-theme="dark"] .card, [data-design="midnight"][data-theme="dark"] .gcard, [data-design="midnight"][data-theme="dark"] .tbl-wrap, [data-design="midnight"][data-theme="dark"] .sp-item { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 10px 30px rgba(0, 0, 0, .35); }
[data-design="midnight"] .pane-head { background: transparent; }
[data-design="midnight"] .gutter, [data-design="midnight"] .pane-foot { background: transparent; }
[data-design="midnight"] .badge { border-radius: 999px; }
[data-design="midnight"] .sp-item.top { border-color: transparent; box-shadow: 0 0 0 2px var(--accent), var(--glow); }
[data-design="midnight"] .tab.on { color: var(--accent); }

/* ---------- E. 모노 (흑백 · 스위스 타이포) ---------- */
:root[data-design="mono"] {
  --bg: #ffffff; --bg-elev: #ffffff; --bg-sunk: #f5f5f5; --bg-hover: #eeeeee;
  --border: #e4e4e4; --border-strong: #0a0a0a;
  --text: #0a0a0a; --text-dim: #525252; --text-faint: #a3a3a3;
  --accent: #1d4bff; --accent-hover: #0d39e6; --accent-weak: #e9eeff; --accent-text: #ffffff;
  --ok: #00875a; --ok-weak: #e3f5ee; --warn: #c2410c; --warn-weak: #fdeee6; --err: #e5172f; --err-weak: #fde7ea; --info: #1d4bff; --info-weak: #e9eeff;
  --info-line: #c2cfff; --warn-line: #f6c6ab; --err-line: #f6b3bc; --ok-line: #a9dcc6;

    const tr = h(`<tr><td>${check ? '<input type="checkbox">' : ''}</td><td><input type="text"></td><td><input type="text"></td><td><button class="btn xs ghost" type="button" title="삭제">✕</button></td></tr>`);

}

/* ---------- JSON 트리 뷰어 ---------- */
function JsonTree(opts = {}) {
  const el = h(`<div style="display:flex;flex-direction:column;min-height:0;flex:1">
    <div class="jt-path"><span class="faint">경로</span><code data-ref="path">$</code><span class="sp"></span>
      <button class="btn xs ghost" data-ref="cpPath" type="button" title="JSONPath 복사">경로</button>
      <button class="btn xs ghost" data-ref="cpJs" type="button" title="JS/Java 접근식 복사">접근식</button>
      <button class="btn xs ghost" data-ref="cpVal" type="button" title="선택 값 복사">값</button>
      <span class="sep" style="width:1px;height:16px;background:var(--border)"></span>
      <input class="inp sm" data-ref="q" placeholder="키 / 값 검색" style="width:150px">
      <span class="faint" data-ref="qc" style="min-width:42px;text-align:center"></span>
      <button class="btn xs ghost" data-ref="prev" type="button" title="이전">▲</button><button class="btn xs ghost" data-ref="next" type="button" title="다음">▼</button>
      <button class="btn xs ghost" data-ref="exp" type="button">모두 펼치기</button><button class="btn xs ghost" data-ref="col" type="button">접기</button></div>
    <div class="pane-view"><div class="jt" data-ref="tree"></div></div></div>`);
  const r = refs(el);
  let root = null, selPath = [], selNode = null, rowMap = new Map(), hits = [], hitIdx = -1;
  const keyOf = path => JSON.stringify(path);
  function preview(nd) {
    switch (nd.T) {
      case 'O': return `<span class="jt-meta">{${nd.p.length}}</span>`;
      case 'A': return `<span class="jt-meta">[${nd.v.length}]</span>`;
      case 'S': return `<span class="t-str">${esc(JSON.stringify(nd.v.length > 300 ? nd.v.slice(0, 300) + '…' : nd.v))}</span>`;
      case 'N': return `<span class="t-num">${esc(nd.v)}</span>`;
      case 'B': return `<span class="t-bool">${nd.v}</span>`;
      default: return '<span class="t-null">null</span>';
    }
  }
  function makeNode(key, nd, path) {
    const wrap = document.createElement('div');
    const row = document.createElement('div'); row.className = 'jt-row';
    const container = nd.T === 'O' || nd.T === 'A';
    const cnt = container ? (nd.T === 'O' ? nd.p.length : nd.v.length) : 0;
    row.innerHTML = `<span class="jt-tog">${container && cnt ? '▸' : ''}</span>` +
      (key === null ? '<span class="jt-meta">$</span>' : typeof key === 'number' ? `<span class="jt-idx">${key}</span>` : `<span class="jt-key">${esc(key)}</span>`) +
      `<span class="t-p">:</span> <span class="jt-val">${preview(nd)}</span>`;
    wrap.appendChild(row);
    rowMap.set(keyOf(path), { row, wrap, nd, path });
    row._info = { nd, path, wrap };
    return wrap;
  }
  function expand(info, open) {
    const { nd, path, wrap } = info; if (nd.T !== 'O' && nd.T !== 'A') return;
    let kids = wrap.querySelector(':scope > .jt-kids');
    const tog = wrap.firstChild.firstChild;
    if (open === undefined) open = !kids || kids.classList.contains('hidden');
    if (open && !kids) {
      kids = document.createElement('div'); kids.className = 'jt-kids';
      const frag = document.createDocumentFragment();
      const items = nd.T === 'O' ? nd.p.map(([k, v]) => [k, v]) : nd.v.map((v, j) => [j, v]);
      const LIMIT = 2000;
      items.slice(0, LIMIT).forEach(([k, v]) => frag.appendChild(makeNode(k, v, path.concat(k))));
      if (items.length > LIMIT) { const more = h(`<div class="jt-meta" style="padding:2px 18px">… ${fmtNum(items.length - LIMIT)}개 더 있음 (텍스트 보기 사용)</div>`); frag.appendChild(more); }
      kids.appendChild(frag); wrap.appendChild(kids);
    }
    if (kids) kids.classList.toggle('hidden', !open);
    if (tog.textContent) tog.textContent = open ? '▾' : '▸';
  }
  function expandDepth(info, depth, budget) {
    if (depth <= 0 || budget.n <= 0) return;
    const nd = info.nd; if (nd.T !== 'O' && nd.T !== 'A') return;
    const cnt = nd.T === 'O' ? nd.p.length : nd.v.length; if (!cnt) return;
    expand(info, true); budget.n -= cnt;
    const kids = info.wrap.querySelector(':scope > .jt-kids');
    for (const w of kids.children) if (w.firstChild && w.firstChild._info) expandDepth(w.firstChild._info, depth - 1, budget);
  }
  function select(info) {
    $$('.jt-row.sel', r.tree).forEach(x => x.classList.remove('sel'));
    rowMap.get(keyOf(info.path)).row.classList.add('sel');
    selPath = info.path; selNode = info.nd;
    r.path.textContent = JSONX.pathStr(selPath);
    if (opts.onSelect) opts.onSelect(info);
  }
  function reveal(path) {
    let info = rowMap.get(keyOf([]));
    for (let j = 0; j < path.length; j++) {
      expand(info, true);
      info = rowMap.get(keyOf(path.slice(0, j + 1)));
      if (!info) return null;
    }
    info.row.scrollIntoView({ block: 'center' });
    return info;
  }
  on(r.tree, 'click', e => {
    const row = e.target.closest('.jt-row'); if (!row) return;
    const info = row._info;
    if (e.target.classList.contains('jt-tog') || e.detail === 2) expand(info);
    select(info);
  });
  on(r.tree, 'dblclick', e => e.preventDefault());
  on(r.cpPath, 'click', () => copyText(JSONX.pathStr(selPath), 'JSONPath 복사: ' + JSONX.pathStr(selPath)));
  on(r.cpJs, 'click', () => copyText(JSONX.jsPath(selPath)));
  on(r.cpVal, 'click', () => { if (selNode) copyText(selNode.T === 'S' ? selNode.v : JSONX.stringify(selNode, { indent: 2 })); });
  on(r.exp, 'click', () => {
    const st = JSONX.stats(root);
    if (st.nodes > 20000 && !confirm(`노드가 ${fmtNum(st.nodes)}개입니다. 모두 펼치면 느려질 수 있습니다. 계속할까요?`)) return;
    expandDepth(rowMap.get(keyOf([])), 999, { n: 50000 });
  });
  on(r.col, 'click', () => { $$('.jt-kids', r.tree).forEach(k => k.classList.add('hidden')); $$('.jt-tog', r.tree).forEach(t => { if (t.textContent) t.textContent = '▸'; }); expand(rowMap.get(keyOf([])), true); });
  function search() {
    $$('.jt-row.hit', r.tree).forEach(x => x.classList.remove('hit'));
    const q = r.q.value.trim().toLowerCase(); hits = []; hitIdx = -1;
    if (!q || !root) { r.qc.textContent = ''; return; }
    (function walk(nd, path) {
      if (hits.length >= 5000) return;
      const k = path.length ? String(path[path.length - 1]).toLowerCase() : '';
      const v = nd.T === 'S' ? nd.v.toLowerCase() : nd.T === 'N' ? nd.v : nd.T === 'B' ? String(nd.v) : nd.T === 'Z' ? 'null' : '';
      if ((typeof path[path.length - 1] === 'string' && k.includes(q)) || (v && v.includes(q))) hits.push(path);
      if (nd.T === 'O') nd.p.forEach(([kk, vv]) => walk(vv, path.concat(kk)));
      else if (nd.T === 'A') nd.v.forEach((vv, j) => walk(vv, path.concat(j)));
    })(root, []);
    r.qc.textContent = hits.length ? `0/${hits.length >= 5000 ? '5000+' : hits.length}` : '0건';
    if (hits.length) go(1);
  }
  function go(d) {
    if (!hits.length) return;
    hitIdx = (hitIdx + d + hits.length) % hits.length;
    $$('.jt-row.hit', r.tree).forEach(x => x.classList.remove('hit'));
    const info = reveal(hits[hitIdx]);
    if (info) { info.row.classList.add('hit'); select(info); }
    r.qc.textContent = `${hitIdx + 1}/${hits.length}`;
  }
  on(r.q, 'input', debounce(search, 250));
  on(r.q, 'keydown', e => { if (e.key === 'Enter') go(e.shiftKey ? -1 : 1); });
  on(r.next, 'click', () => go(1)); on(r.prev, 'click', () => go(-1));
  return {
    el,
    render(node) {
      root = node; rowMap = new Map(); r.tree.innerHTML = ''; selPath = []; selNode = node; r.path.textContent = '$';
      if (!node) { r.tree.innerHTML = '<div class="pane-empty">JSON을 입력하면 트리가 표시됩니다.</div>'; return; }
      const w = makeNode(null, node, []); r.tree.appendChild(w);
      expandDepth(w.firstChild._info, 2, { n: 3000 });
      if (r.q.value.trim()) search();
    },
    reveal,
  };
}

/* ---------- JSON Diff ---------- */
const JsonDiff = (() => {
  function canon(nd, opt) {
    if (nd.T === 'O') return '{' + nd.p.filter(([k]) => !opt.ignore.has(k)).sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, v]) => JSON.stringify(k) + ':' + canon(v, opt)).join(',') + '}';
    if (nd.T === 'A') { const xs = nd.v.map(x => canon(x, opt)); if (opt.ignoreOrder) xs.sort(); return '[' + xs.join(',') + ']'; }
    if (nd.T === 'N' && opt.numeric) { const n = Number(nd.v); return Math.abs(n) <= 9007199254740991 ? String(n) : nd.v; }

  if (/json/.test(ct)) return 'json';
  if (/(^|\/|\+)xml/.test(ct)) return 'xml';
  if (/html/.test(ct)) return 'html';
  if (/^image\//.test(ct)) return 'image';
  if (/pdf|zip|octet-stream|msword|excel|spreadsheet|presentation|audio|video|font/.test(ct)) return 'binary';
  if (/^text\/|javascript|css|csv|x-www-form/.test(ct)) return 'text';
  if (bytes && bytes.length) {
    const head = new TextDecoder('latin1').decode(bytes.subarray(0, 16));
    if (/^\x89PNG|^GIF8|^\xFF\xD8\xFF|^RIFF.{4}WEBP|^BM/.test(head)) return 'image';
    if (/^%PDF|^PK\x03\x04/.test(head)) return 'binary';
    let ctrl = 0; const n = Math.min(bytes.length, 2000);
    for (let i = 0; i < n; i++) { const b = bytes[i]; if (b < 9 || (b > 13 && b < 32)) ctrl++; }
    if (ctrl > n * 0.05) return 'binary';
  }
  return 'text';
}
function hexDump(bytes, max = 4096) {
  const lines = [];
  for (let i = 0; i < Math.min(bytes.length, max); i += 16) {
    const chunk = bytes.subarray(i, i + 16);
    const hex = Array.from(chunk, b => b.toString(16).padStart(2, '0')).join(' ');
    const asc = Array.from(chunk, b => b >= 32 && b < 127 ? String.fromCharCode(b) : '.').join('');
    lines.push(i.toString(16).padStart(8, '0') + '  ' + hex.padEnd(48) + ' ' + asc);
  }
  if (bytes.length > max) lines.push(`… (${fmtNum(bytes.length - max)} 바이트 더 있음)`);
  return lines.join('\n');
}
DU.guessKind = guessKind;

    /* ---- 초안 저장/로드 ---- */

        const fd = new FormData();

        <div class="row" style="gap:6px">${shown.map((p, i) => `<div style="text-align:center;border:1px solid var(--border);border-radius:6px;padding:4px 10px;min-width:56px"><div class="mono" style="font-size:15px;font-weight:700">${esc(p)}</div><div class="faint" style="font-size:11px">${names[i]}</div></div>`).join('')}</div></div>`));
      const runs = Cron.next(c, Date.now(), +cnt.value, tz.value);
      if (!runs.length) { res.appendChild(h('<div class="note warn">앞으로 50년 안에 실행되는 시각이 없습니다 (예: 2월 30일)</div>')); return; }
      const tw = h('<div class="tbl-wrap"></div>');
      tw.innerHTML = `<table class="tbl"><thead><tr><th>#</th><th>다음 실행 (${tz.value.toUpperCase()})</th><th>요일</th><th>남은 시간</th><th>간격</th></tr></thead><tbody>${runs.map((t, i) => `<tr><td class="faint">${i + 1}</td><td class="mono">${DateX.format(t, 'yyyy-MM-dd HH:mm:ss', tz.value)}</td><td>${DateX.format(t, 'E', tz.value)}</td><td class="dim">${relTime(t)}</td><td class="dim mono">${i ? DateX.human(t - runs[i - 1]) : ''}</td></tr>`).join('')}</tbody></table>`;
      res.appendChild(tw);
      const java = c.dialect === 'linux' ? `0 ${c.parts.slice(1).join(' ')}` : c.parts.slice(0, 6).join(' ');
      const sb = h(`<div class="row"><span class="dim">Spring 형식</span><code class="mono">@Scheduled(cron = "${esc(java)}"${tz.value === 'kst' ? ', zone = "Asia/Seoul"' : ''})</code></div>`);
      sb.appendChild(copyBtn(`@Scheduled(cron = "${java}"${tz.value === 'kst' ? ', zone = "Asia/Seoul"' : ''})`));

    on(expr, 'input', debounce(run, 300)); on(expr, 'keydown', e => { if (e.key === 'Enter') run(); });
    [dia, tz, cnt].forEach(x => on(x, 'change', run));
    run();
    return { run, receive(slot, t) { expr.value = t.trim(); run(); } };
  },
});

/* =====================================================================
 * Smart Paste — 붙여넣은 텍스트 / 끌어다 놓은 파일을 자동 감지해 도구 추천
 *
 * 감지기 등록 (다른 모듈에서도 추가 가능):
 *   defineDetector({ id, test(text, ctx) → null | 결과 | 결과[] })
 *     결과: { key, score(0~100), label, detail?, actions: [동작] }
 *     같은 key의 결과는 하나로 합쳐짐 (점수는 최댓값, 동작은 이어 붙임)
 *   defineFileDetector({ id, test(file, head(Uint8Array 앞 64KB), ext) → null | 결과 })
 *   동작: { label, tool, slot?, text?, after?('run' 등 인스턴스 메서드), recipe?: [단계], run?(text|file) }
 *   ctx: { text, t(trim), lines, json(→ {node, levels} | null, 지연 계산), bytes }
 * ===================================================================== */
const DETECTORS = [], FILE_DETECTORS = [];
function defineDetector(d) { DETECTORS.push(d); }
function defineFileDetector(d) { FILE_DETECTORS.push(d); }

const SmartPaste = (() => {
  function makeCtx(text) {
    const c = { text, t: text.trim() };
    c.lines = c.t.split(/\r?\n/);
    c.oneLine = c.lines.length === 1;
    let jd = false, jv = null;
    Object.defineProperty(c, 'json', { get() { if (!jd) { jd = true; if (c.t.length < 30e6 && /^["'{[\\]/.test(c.t)) { try { jv = JSONX.smartParse(c.t); } catch (e) { jv = null; } } } return jv; } });
    return c;
  }
  function detect(text) {
    if (!text || !text.trim()) return [];
    const ctx = makeCtx(text); const map = new Map();
    for (const d of DETECTORS) {
      let r = null;
      try { r = d.test(text, ctx); } catch (e) { console.warn('detector', d.id, e); }
      (Array.isArray(r) ? r : r ? [r] : []).forEach(x => merge(map, x, d.id));
    }
    return Array.from(map.values()).sort((a, b) => b.score - a.score);
  }
  function merge(map, x, id) {
    const k = x.key || id; const ex = map.get(k);
    if (!ex) { map.set(k, Object.assign({}, x, { key: k, actions: (x.actions || []).slice(), _ls: x.score })); return; }
    ex.score = Math.max(ex.score, x.score);
    if (x.label && x.score > ex._ls) { ex.label = x.label; ex._ls = x.score; if (x.detail) ex.detail = x.detail; }
    else if (!ex.detail && x.detail) ex.detail = x.detail;
    (x.actions || []).forEach(a => { if (!ex.actions.some(b => b.label === a.label)) ex.actions.push(a); });
  }
  function runAction(a, payload) {
    if (a.run) return a.run(payload);
    const text = a.text != null ? a.text : payload;
    if (a.recipe) { Recipe.openWith(a.recipe, text); return; }
    sendTo(a.tool, a.slot, text);
    if (a.after) { const inst = toolInst(a.tool); if (inst && inst[a.after]) inst[a.after](); }
  }
  function itemEl(r, i, payload, onPick) {
    const el = h(`<div class="sp-item${i === 0 ? ' top' : ''}"><div class="sp-h"><b></b><span class="sp-score">확신도 ${Math.round(r.score)}%</span></div>${r.detail ? '<div class="sp-d"></div>' : ''}<div class="row"></div></div>`);
    $('b', el).textContent = r.label; if (r.detail) $('.sp-d', el).textContent = r.detail;
    const row = $('.row', el);
    r.actions.slice(0, 7).forEach((a, k) => row.appendChild(btn(a.label, () => { if (onPick) onPick(); runAction(a, payload); }, 'sm' + (i === 0 && k === 0 ? ' primary' : ''))));
    return el;
  }
  function render(box, text, onPick, max = 8) {
    box.innerHTML = '';
    const res = detect(text).slice(0, max);
    if (!text.trim()) return res;
    if (!res.length) box.appendChild(h('<div class="empty-state">알맞은 도구를 찾지 못했습니다 — 기능 검색(Ctrl+K)을 사용하세요</div>'));
    res.forEach((r, i) => box.appendChild(itemEl(r, i, text, onPick)));
    return res;
  }
  function open(text = '') {
    const body = h(`<div style="display:flex;flex-direction:column;gap:10px">
      <textarea class="inp" rows="6" placeholder="분석할 내용을 붙여넣으세요 — JSON, 이스케이프 문자열, JWT, Base64, cURL, 로그, 스택 트레이스, SQL, cron, 타임스탬프, 인증서 …"></textarea>
      <div class="sp-res"></div></div>`);
    const ta = $('textarea', body), box = $('.sp-res', body);
    ta.value = text.length > 2e6 ? text.slice(0, 2e6) : text;
    let full = text;
    const m = openModal({ title: '⚡ Smart Paste — 입력 자동 감지', body, wide: true });
    const go = () => render(box, full, () => m.close());
    on(ta, 'input', debounce(() => { full = ta.value; go(); }, 250));
    on(ta, 'keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const b = $('.sp-item .btn', box); if (b) b.click(); } });
    if (full) go(); ta.focus();
    if (text.length > 2e6) box.insertAdjacentHTML('beforebegin', `<div class="note warn">큰 입력(${fmtBytes(text.length)})입니다. 미리보기는 앞부분만 표시하지만 도구로는 전체가 전달됩니다.</div>`);
  }
  function card() {
    const el = h(`<div class="gcard" style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0">⚡ Smart Paste <span class="faint" style="font-weight:400">— 아무 내용이나 붙여넣으면 형식을 감지해 알맞은 도구와 변환을 추천합니다</span></h3>
      <textarea class="inp" rows="3" placeholder="예) &quot;{\\&quot;user\\&quot;:{\\&quot;id\\&quot;:1}}&quot; · eyJhbGciOi… · H4sIAAAA… · curl -X POST … · 0 0/5 * * * ? · 1761610522 · -----BEGIN CERTIFICATE-----"></textarea><div class="sp-res"></div></div>`);
    const ta = $('textarea', el), box = $('.sp-res', el);
    on(ta, 'input', debounce(() => render(box, ta.value, null, 4), 250));
    return el;
  }
  /** 파일 → 감지 */
  async function openFile(file) {
    const head = new Uint8Array(await file.slice(0, 65536).arrayBuffer());
    const ext = (file.name.match(/\.([\w-]+)$/) || [])[1] || '';
    const map = new Map();
    for (const d of FILE_DETECTORS) { let r = null; try { r = await d.test(file, head, ext.toLowerCase()); } catch (e) { console.warn('file detector', d.id, e); } (Array.isArray(r) ? r : r ? [r] : []).forEach(x => merge(map, x, d.id)); }
    let textRes = [], text = null;
    const binary = guessKind('', head) === 'binary' || sniffMime(head);
    if (!binary && file.size <= 50 * 1048576) {
      text = decodeBytes(new Uint8Array(await file.arrayBuffer())).text;
      textRes = detect(text).slice(0, 5);
    }
    const results = Array.from(map.values()).sort((a, b) => b.score - a.score);
    const body = h(`<div style="display:flex;flex-direction:column;gap:10px"><div class="row"><b></b><span class="badge"></span><span class="dim"></span></div><div class="sp-res"></div></div>`);
    $('b', body).textContent = file.name; $('.badge', body).textContent = fmtBytes(file.size); $('.dim', body).textContent = file.type || (binary ? '바이너리' : '텍스트');
    const box = $('.sp-res', body);
    const m = openModal({ title: '⚡ 파일 자동 감지', body, wide: true });
    const all = results.map(r => ({ r, pay: file })).concat(textRes.map(r => ({ r, pay: text }))).sort((x, y) => y.r.score - x.r.score);
    all.forEach((x, i) => box.appendChild(itemEl(x.r, i, x.pay, () => m.close())));
    if (!results.length && !textRes.length) box.appendChild(h(`<div class="empty-state">${binary ? '알 수 없는 바이너리 파일입니다' : file.size > 50 * 1048576 ? '50MB를 넘는 텍스트 파일입니다. 로그 분석기의 [파일 열기]를 사용하세요' : '알맞은 도구를 찾지 못했습니다'}</div>`));
  }
  return { detect, open, card, openFile, runAction };
})();
DU.SmartPaste = SmartPaste;

/* ---------- 기본 감지기 (기존 도구) ---------- */
const spAct = (label, tool, extra = {}) => Object.assign({ label, tool }, extra);
const spPreview = (s, n = 160) => { s = String(s).replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
const printableRatio = b => { let ok = 0; const n = Math.min(b.length, 4000); if (!n) return 0; const t = new TextDecoder('utf-8').decode(b.subarray(0, n)); for (const ch of t) { const c = ch.charCodeAt(0); if (c >= 32 || c === 9 || c === 10 || c === 13) if (ch !== '\uFFFD') ok++; } return ok / Array.from(t).length; };

defineDetector({ id: 'json', test(text, c) {
  const j = c.json; if (!j) return null;
  const n = j.node, out = [];
  if (j.levels > 0) {
    const pretty = JSONX.stringify(n, { indent: 2 });
    out.push({ key: 'json-escaped', score: 97, label: `이스케이프된 JSON 문자열 (${j.levels}단계)`, detail: spPreview(pretty),
      actions: [spAct('이스케이프 해제 + 정렬', 'json-format'), spAct('단계별 해제 보기', 'json-escape'), { label: '정렬된 JSON 복사', run: () => copyText(pretty) }] });
  }
  if (n.T === 'O' || n.T === 'A') {
    const st = JSONX.stats(n);
    const isOas = n.T === 'O' && (JSONX.get(n, 'openapi') || JSONX.get(n, 'swagger')) && JSONX.get(n, 'paths');
    if (isOas) out.push({ key: 'openapi', score: 99, label: `OpenAPI / Swagger 명세 (API ${JSONX.get(n, 'paths').p.length}개 경로)`, actions: [spAct('OpenAPI 뷰어', 'openapi')] });
    const acts = [spAct('JSON 포매터 · 트리', 'json-format'), spAct('JSONPath 검색', 'json-path')];
    const arr = n.T === 'A' ? n : findArray(n) ? findArray(n).node : null;
    if (arr && arr.v.length) acts.push(spAct('컬렉션 도구', 'json-array'));
    if (arr && arr.v.length && arr.v.every(x => x.T === 'O')) acts.push(spAct('CSV · 표 변환', 'csv'));
    acts.push(spAct('JSON 비교 (왼쪽)', 'json-diff', { slot: 'left' }));
    if (j.levels === 0) out.push({ key: 'json', score: isOas ? 80 : 95, label: `JSON ${JSONX.typeName(n)} — ${n.T === 'A' ? `항목 ${n.v.length}개` : `키 ${n.p.length}개`} · 깊이 ${st.depth}`, detail: spPreview(c.t, 120), actions: acts });
    else out[0].actions.push(...acts.slice(1));
  } else if (n.T === 'S' && j.levels === 0 && /\\[nrt"\\u]/.test(c.t)) {
    out.push({ key: 'json-string', score: 72, label: 'JSON 문자열 리터럴 (이스케이프 포함)', detail: spPreview(n.v), actions: [spAct('이스케이프 해제', 'json-escape'), { label: '해제된 값 복사', run: () => copyText(n.v) }] });
  }
  return out;
} });
defineDetector({ id: 'jwt', test(text, c) {
  if (!c.oneLine || !/^(Bearer\s+)?eyJ[\w-]*\.[\w-]+\.[\w-]*$/.test(c.t)) return null;
  let detail = ''; try { const d = Jwt.decode(c.t); detail = `alg=${d.headerJs.alg} · ${spPreview(d.payload.text, 120)}${typeof d.payloadJs.exp === 'number' ? ` · 만료 ${relTime(d.payloadJs.exp * 1000)}` : ''}`; } catch (e) { return null; }

defineDetector({ id: 'curl', test(text, c) {

defineDetector({ id: 'url', test(text, c) {

defineDetector({ id: 'base64', test(text, c) {

  const pr = printableRatio(b);
  if (pr < 0.92) return { key: 'base64', score: 35, label: 'Base64 (바이너리 데이터)', detail: `${fmtBytes(b.length)}`, actions: [spAct('Base64 디코드', 'base64')] };
  const dec = decodeBytes(b).text;
  if (/^\s*[{[]/.test(dec)) return { key: 'base64', score: 93, label: 'Base64 인코딩된 JSON', detail: spPreview(dec), actions: [{ label: '디코드 + JSON 정렬', recipe: [{ op: 'b64-decode' }, { op: 'text-decode' }, { op: 'json-pretty' }] }, spAct('Base64 도구', 'base64')] };
  return { key: 'base64', score: s.length >= 24 ? 78 : 60, label: 'Base64 인코딩된 텍스트', detail: spPreview(dec), actions: [spAct('Base64 디코드', 'base64'), { label: '디코딩 결과 복사', run: () => copyText(dec) }] };
} });
defineDetector({ id: 'hex', test(text, c) {

defineDetector({ id: 'unicode', test(text, c) {

 *   defineOp({ id, name, group, desc?, input: 'text'|'bytes'|'any',
 *              params: [{ k, label, type: 'text'|'select'|'bool'|'num', def, options: [[값, 라벨]], secret? }],
 *              run(값, 파라미터) → string | Uint8Array | Promise })

    for (const st of steps) {

      if (!op) { res.push({ ok: false, err: `알 수 없는 연산: ${st.op}` }); break; }
      if (st.on === false) { res.push({ ok: true, skip: true, out: v, ms: 0 }); continue; }
      const t0 = performance.now();
      try {
        const inV = op.input === 'text' ? asText(v) : op.input === 'bytes' ? asBytes(v) : v;
        v = await op.run(inV, Object.assign(defaults(op), st.p || {}));
        if (v == null) v = '';
        res.push({ ok: true, out: v, ms: performance.now() - t0 });
      } catch (e) { res.push({ ok: false, err: e.message || String(e), ms: performance.now() - t0 }); break; }
    }
    return res;
  }

  }

      const ms = (performance.now() - t0).toFixed(1);
      const dn = { '07': 'draft-07', 2019: '2019-09', 2020: '2020-12' }[r.draft];
      const head = h(`<div class="row" style="padding:8px 10px;border-bottom:1px solid var(--border)">${r.errors.length ? `<span class="badge err">✕ 유효하지 않음 — 오류 ${r.errors.length}개</span>` : '<span class="badge ok">✓ 스키마를 만족합니다</span>'}<span class="dim">${dn} · ${ms}ms</span></div>`);
      res.appendChild(head);
      if (!r.errors.length) return;
      const tw = h(`<table class="tbl"><thead><tr><th>위치 (데이터)</th><th style="width:110px">키워드</th><th>내용</th><th>스키마 경로</th></tr></thead><tbody></tbody></table>`);
      const tb = $('tbody', tw);
      r.errors.slice(0, 1000).forEach(e => {
        const tr = h(`<tr class="ja-err-row" title="클릭하면 데이터의 해당 위치로 이동"><td class="mono"></td><td><span class="badge warn"></span></td><td></td><td class="mono faint"></td></tr>`);
        tr.children[0].textContent = JSONX.pathStr(e.path); $('.badge', tr).textContent = e.kw; tr.children[2].textContent = e.msg; tr.children[3].textContent = e.sp;
        if (e.sub && e.sub.length) { const d = h('<div class="faint" style="font-size:12px;margin-top:2px"></div>'); d.textContent = '가장 가까운 후보의 오류: ' + e.sub.slice(0, 3).map(x => `${JSONX.pathStr(x.path)} ${x.msg}`).join(' / '); tr.children[2].appendChild(d); }
        on(tr, 'click', () => {
          const off = jaLocate(dataP.get(), e.path);
          if (off < 0) { toast('원문에서 위치를 찾지 못했습니다 (이스케이프된 입력 등)', 'warn'); return; }
          const lc = lineColOf(dataP.get(), off); dataP.goto(lc.line, lc.col); dataP.markError(lc.line, lc.col);
        });
        tb.appendChild(tr);
      });
      res.appendChild(tw);
      if (r.errors.length > 1000) res.appendChild(h('<div class="faint" style="padding:6px">앞 1000개만 표시</div>'));
    }
    const lazy = debounce(() => { if (oLive.get()) run(); }, 400);
    dataP.onInput(lazy); schP.onInput(lazy); on(draft, 'change', run); on(oFmt.input, 'change', run);
    if (dataP.get() && schP.get()) run();
    return { run, receive(slot, t) { (slot === 'schema' ? schP : dataP).set(t); run(); } };
  },
});

defineTool({

  help: `<b>JSON Patch (RFC 6902)</b> — <code>[{"op":"replace","path":"/a/0","value":1}]</code> 형식의 연산을 순서대로 적용합니다. 하나라도 실패하면 RFC 규칙에 따라 전체가 적용되지 않습니다(<b>실패해도 계속</b> 옵션으로 부분 적용 가능).<br>
    <b>Merge Patch (RFC 7396)</b> — 바꿀 값만 담은 객체를 병합합니다. <code>null</code>은 키 삭제를 뜻합니다.<br>
    <b>생성</b> 모드에서는 가운데 칸을 목표 문서로 보고 원본 → 목표 패치를 만듭니다. 배열은 인덱스 기준으로 비교합니다.`,
  init(root) {
    let kind = persistGet('jpt:kind', '6902'), mode = persistGet('jpt:mode', 'apply');
    const tabs = Tabs([{ id: '6902', label: 'JSON Patch (RFC 6902)' }, { id: '7396', label: 'Merge Patch (RFC 7396)' }], id => { kind = id; persistSet('jpt:kind', id); titles(); run(); });
    const modeSeg = Seg([['apply', '적용'], ['gen', '생성 (원본 → 목표)']], mode, v => { mode = v; persistSet('jpt:mode', v); titles(); run(); });
    const oCont = chk('실패해도 계속', 'jpt:cont');
    const bar = h('<div class="toolbar"></div>');
    bar.append(btn('실행', run, 'primary', 'Ctrl+Enter'), modeSeg.el, oCont.el, h('<span class="sp"></span>'), sampleBtn('예제', () => {
      docP.set(JSON.stringify({ name: '홍길동', roles: ['USER'], address: { city: '서울', zip: '04524' }, temp: 1 }, null, 2));
      if (kind === '6902') patP.set(JSON.stringify([{ op: 'replace', path: '/name', value: '김철수' }, { op: 'add', path: '/roles/-', value: 'ADMIN' }, { op: 'remove', path: '/temp' }, { op: 'move', from: '/address/zip', path: '/zip' }, { op: 'test', path: '/address/city', value: '서울' }], null, 2));
      else patP.set(JSON.stringify({ name: '김철수', temp: null, address: { zip: '06000' } }, null, 2));
      modeSeg.set('apply'); mode = 'apply'; titles(); run();
    }));
    const docP = Pane({ title: '원본 문서', persist: 'jptD', placeholder: '원본 JSON 문서', sendFrom: 'json-patch' });
    const patP = Pane({ title: '패치', persist: 'jptP', placeholder: '', sendFrom: 'json-patch' });
    const out = Pane({ title: '결과', readonly: true, lang: 'json', sendFrom: 'json-patch' });
    const grid = h('<div class="ja-split3"></div>'); grid.append(docP.el, patP.el, out.el);
    const logBox = h('<div class="tbl-wrap" style="max-height:26vh"></div>');

    function titles() {
      patP.setTitle(mode === 'gen' ? '목표 문서' : kind === '6902' ? '패치 (연산 배열)' : 'Merge Patch 문서');
      patP.setPlaceholder(mode === 'gen' ? '바뀐 후의 JSON 문서' : kind === '6902' ? '[\n  { "op": "replace", "path": "/name", "value": "김철수" }\n]' : '{ "name": "김철수", "temp": null }');
